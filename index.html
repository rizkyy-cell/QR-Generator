    <style>

      /* Gaya untuk kotak banner */
.panel-banner {
    position: relative;
    padding: 35px 20px;
    text-align: center;
    color: white;
    font-weight: bold;
    font-size: 18px;
    letter-spacing: 0.5px;
    overflow: hidden;
    border-radius: 20px 20px 0 0; /* Opsional: melengkungkan sudut atas */
}

/* Mengatur video agar pas memenuhi kotak banner saja */
.banner-video {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
}

/* Mengatur teks judul agar ada di atas video */
.banner-text {
    position: relative;
    z-index: 2;
    text-shadow: 0px 2px 6px rgba(0, 0, 0, 0.9); /* Bayangan hitam agar teks terbaca */
}

        /* Reset & Base Styles */
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0A0F1D;
            color: #ffffff;
            display: flex;
            justify-content: center;
            padding: 20px;
            min-height: 100vh;
        }

        /* CONTAINER (Susunan Atas-Bawah) */
        .container {
            display: flex;
            flex-direction: column; 
            align-items: center;
            gap: 20px;
            max-width: 500px; 
            width: 100%;
        }
    
        /* PANEL UTAMA (Glassmorphism) */
        .panel {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0;
            border-radius: 20px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* BANNER JUDUL (Dengan Video Background) */
        .panel-banner {
            position: relative;
            padding: 35px 20px;
            text-align: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 0.5px;
            overflow: hidden;
        }
        .banner-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .banner-text {
            position: relative;
            z-index: 2;
            text-shadow: 0px 2px 6px rgba(0, 0, 0, 0.9); /* Bayangan agar teks kontras di atas video */
        }

        /* AREA FORM */
        .form-content {
            padding: 25px;
        }
        .form-group { margin-bottom: 16px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffffff; 
            font-size: 13px;
            font-weight: bold;
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background-color: rgba(31, 41, 55, 0.8);
            border: 1px solid #374151;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control::placeholder { color: #9CA3AF; }
        .form-control:focus { border-color: #3B82F6; }
        .form-row { display: flex; gap: 15px; }
        .form-row .form-group { flex: 1; }

        /* BUTTON SUBMIT */
        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: #3B82F6;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            margin-top: 15px;
            transition: background-color 0.2s;
        }
        .btn-submit:hover { background-color: #2563EB; }
        .hidden { display: none !important; }

        /* AREA PREVIEW & TEMPLATE QRIS */
        .preview-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .qris-template {
            position: relative;
            width: 380px; 
            height: 538px;
            background-color: white;
            background-image: url('qr-background.jpg'); /* Pastikan file ini ada di folder HP */
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            overflow: hidden;
            color: black;
            flex-shrink: 0; 
        }

        /* TIPOGRAFI TEMPLATE */
        .abs-text { position: absolute; width: 100%; text-align: center; z-index: 10; background: transparent; }
        .disp-name { top: 110px; font-weight: 800; font-size: 22px; letter-spacing: 0.5px; color: #000000; }
        
        /* Font NMID & TID lebih tipis, warna abu-abu gelap */
        .disp-nmid { top: 140px; font-size: 14px; font-weight: 500; color: #374151; }
        .disp-tid { top: 160px; font-size: 15px; font-weight: 500; color: #374151; }
        
        /* KOTAK QR CODE (Ukurannya dikecilkan dan diposisikan di tengah) */
        .qr-container {
            position: absolute;
            top: 205px;
            left: 115px; /* (380 - 150) / 2 = 115px (Posisi Pas Tengah) */
            width: 150px;
            height: 150px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 10;
        }

        /* Slogan Baru di bawah QR */
        .disp-slogan {
            position: absolute;
            top: 380px; 
            width: 100%;
            text-align: center;
            font-size: 15px;
            font-weight: 800;
            color: #000000;
            z-index: 10;
        }
        
        .disp-link {
            position: absolute;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            text-align: center;
            font-size: 11px;
            font-weight: 600;
            color: #374151;
            background: transparent;
            padding: 5px 0;
            z-index: 10;
        }
        .disp-link span { color: #1E3A8A; font-weight: bold; }
        
        .disp-footer {
            position: absolute;
            bottom: 25px;
            left: 20px;
            font-size: 10px;
            font-weight: 600;
            line-height: 1.3;
            text-align: left;
            background: transparent;
            padding-right: 5px;
            z-index: 10;
            color: #374151;
        }

        /* BUTTON DOWNLOAD */
        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: #10B981;
            margin-top: 25px;
            width: 100%;
            max-width: 380px;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            transition: background-color 0.2s;
        }
        .btn-download:hover { background-color: #059669; }
        .btn-download svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; }

        /* RESPONSIVE: Layar HP Kecil otomatis zoom-out gambar agar tidak terpotong */
        @media (max-width: 400px) {
            .qris-template {
                transform: scale(0.85);
                transform-origin: top center;
                margin-bottom: -70px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="panel">
            <div class="panel-banner">
                <video autoplay loop muted playsinline class="banner-video">
                    <source src="background-profile.mp4" type="video/mp4">
                </video>
                <span class="banner-text">QRIS Merchant Generator BY kyy</span>
            </div>
            
            <div class="form-content" id="form-qris">
                <div class="form-group">
                    <label>Masukkan Link Pembayaran Aplikasi Anda</label>
                    <input type="text" id="input-qris-data" class="form-control" placeholder="Masukkan link...">
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label>Nama Toko</label>
                    <input type="text" id="input-qris-name" class="form-control" placeholder="Nama Toko Anda">
                </div>
                <div class="form-group">
                    <label>NMID</label>
                    <input type="text" id="input-qris-nmid" class="form-control" placeholder="Contoh: ID102938475601234">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>TID</label>
                        <input type="text" id="input-qris-tid" class="form-control" placeholder="Contoh: A01">
                    </div>
                    <div class="form-group">
                        <label>Kode NNS</label>
                        <input type="text" id="input-qris-nns" class="form-control" placeholder="Contoh: 93600915">
                    </div>
                </div>
                <div class="form-group">
                    <label>Versi Cetak</label>
                    <input type="text" id="input-qris-versi" class="form-control" placeholder="Contoh: 1.0.12.06.26">
                </div>

                <button onclick="generateQris()" class="btn-submit">Generate QRIS Template</button>
            </div>
        </div>

        <div class="panel preview-area hidden" id="preview-section">
            
            <div id="preview-qris" class="qris-template">
                <div id="disp-name" class="abs-text disp-name"></div>
                <div id="disp-nmid" class="abs-text disp-nmid"></div>
                <div id="disp-tid" class="abs-text disp-tid"></div>

                <div class="qr-container" id="qrcode-qris-container"></div>
                
                <div class="disp-slogan">SATU QRIS UNTUK SEMUA</div>

                <div class="disp-link">
                    Cek aplikasi penyelenggara di:<br>
                    <span>https://QR-Generator.vercel.app/</span>
                </div>

                <div class="disp-footer">
                    Dicetak oleh: <span id="disp-nns"></span><br>
                    Versi cetak: <span id="disp-versi"></span>
                </div>
            </div>

            <button onclick="downloadImage()" class="btn-download">
                <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                Download (QRGeneratorBYkyy.png)
            </button>
        </div>

    </div>

    <script>
        function generateQris() {
            // Ambil Input
            const name = document.getElementById('input-qris-name').value.trim();
            const nmid = document.getElementById('input-qris-nmid').value.trim();
            const tid = document.getElementById('input-qris-tid').value.trim();
            const nns = document.getElementById('input-qris-nns').value.trim();
            const versi = document.getElementById('input-qris-versi').value.trim();
            const textInput = document.getElementById('input-qris-data').value.trim();

            if (!textInput) {
                alert("Harap masukkan Link Pembayaran terlebih dahulu!");
                return;
            }

            // Tempel ke Template
            document.getElementById('disp-name').innerText = name || '';
            document.getElementById('disp-nmid').innerText = nmid ? "NMID : " + nmid : '';
            document.getElementById('disp-tid').innerText = tid ? "TID : " + tid : '';
            document.getElementById('disp-nns').innerText = nns || '';
            document.getElementById('disp-versi').innerText = versi || '';

            // Generate QR Code Rapat (Ukuran 150x150)
            const container = document.getElementById('qrcode-qris-container');
            container.innerHTML = ''; 

            new QRCode(container, {
                text: textInput, 
                width: 150, 
                height: 150,
                colorDark : "#000000", 
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H,
                quietZone: 0
            });
            
            // Tampilkan Preview
            document.getElementById('preview-section').classList.remove('hidden');
        }

                // Fungsi Download (Kualitas HD Diperbaiki)
        function downloadImage() {
            const targetElement = document.getElementById('preview-qris');
            window.scrollTo(0,0); 

            html2canvas(targetElement, { 
                scale: 4, // Diubah dari 2 ke 4 agar kualitas gambar super tajam
                useCORS: true,
                backgroundColor: null,
                logging: false,
                imageTimeout: 0 // Tambahan agar render gambar background tidak gagal
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'QRGeneratorBYkyy.png'; 
                link.href = canvas.toDataURL('image/png', 1.0); // Tambahan '1.0' untuk kompresi maksimal
                link.click();
            });
        }
      
    </script>
</body>
</html>
